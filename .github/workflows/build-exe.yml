# Builds OfficeBuddy.exe on every push to main, the same way as in the README, once the tests pass,
# and puts it on the "latest" release, linked from the repository's front page.
name: Build exe

on:
  push:
    branches: [main]
  # Also startable by hand from the Actions tab.
  workflow_dispatch:

# A newer push makes an older build that is still running pointless.
concurrency:
  group: build-exe
  cancel-in-progress: true

jobs:
  test:
    name: Test
    # WinUI and Windows.Data.Pdf need Windows.
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore tests/OfficeBuddy.Core.Tests

      - name: Build
        run: dotnet build tests/OfficeBuddy.Core.Tests -c Release --no-restore

      - name: Run tests
        run: dotnet test tests/OfficeBuddy.Core.Tests -c Release --no-build

  publish:
    name: Build exe
    needs: test
    runs-on: windows-latest
    # Creating the release needs write access to the repository.
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore src/OfficeBuddy.App

      - name: Publish single exe
        run: >
          dotnet publish src/OfficeBuddy.App -c Release --no-restore -o artifacts/single
          -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none

      # One release, "latest", replaced by every build: shown on the repository's front page.
      - name: Replace the latest release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Gebaut aus ${GITHUB_SHA::7}: $(git log -1 --format=%s)

          Office Buddy steht unter der GNU AGPL 3.0. Es enthält GPL Ghostscript 10.06.0 (ebenfalls AGPL 3.0), Quellcode: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/tag/gs10060"
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest artifacts/single/OfficeBuddy.exe \
            --target "$GITHUB_SHA" \
            --title "Office Buddy (neueste Version)" \
            --notes "$notes" \
            --latest
